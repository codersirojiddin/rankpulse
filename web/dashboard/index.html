<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — RankPulse</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 3px; }
</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

<!-- ============ CONFIG ============ -->
<script>
  // Fill these in from your Supabase project settings and your API URL.
  // Keep these identical across index.html / auth/index.html / dashboard/index.html.
  const SUPABASE_URL = "https://https://itfkdqjxknbbmwzzsaux.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml0ZmtkcWp4a25iYm13enpzYXV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczOTk5MTgsImV4cCI6MjEwMjk3NTkxOH0.ZqOzIRtzoUt0KRm6RmM-k-KPq2fzsOv4jJhCpHHQytE";
  const API_BASE_URL = "https://rankpulse-api.onrender.com";

  // Named "sb" (not "supabase") to avoid colliding with the global
  // identifier the supabase-js library itself registers on window.
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>

<!-- ============ AUTH GUARD ============ -->
<!-- This page is protected: only logged-in users may see it.
     If there's no session, bounce to /auth before anything renders. -->
<div id="auth-check" class="min-h-screen flex items-center justify-center">
  <p class="text-sm text-slate-400">Loading your dashboard…</p>
</div>

<!-- ============ DASHBOARD ============ -->
<div id="dashboard-screen" class="hidden">
  <nav class="border-b border-slate-200 bg-white">
    <div class="max-w-6xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center">
          <span class="text-white font-bold text-xs">R</span>
        </div>
        <span class="font-semibold tracking-tight">RankPulse</span>
      </div>
      <div class="flex items-center gap-4">
        <span id="user-email" class="text-sm text-slate-500"></span>
        <button id="signout-btn" class="text-sm text-slate-500 hover:text-slate-900">Sign out</button>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-6 py-8">

    <!-- Projects row -->
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-lg font-semibold">Projects</h1>
      <button id="new-project-btn"
        class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-3 py-1.5 rounded-lg">
        + New Project
      </button>
    </div>

    <div id="projects-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mb-8"></div>

    <!-- Active project panel -->
    <div id="project-panel" class="hidden">
      <div class="flex items-center justify-between mb-4 border-t border-slate-200 pt-6">
        <div>
          <h2 id="panel-domain" class="text-lg font-semibold"></h2>
          <p class="text-xs text-slate-500 mt-0.5">
            <span id="panel-count">0</span>/20 keywords tracked
          </p>
        </div>
        <div class="flex gap-2">
          <input id="new-keyword-input" placeholder="Add a keyword…"
            class="text-sm px-3 py-1.5 border border-slate-300 rounded-lg w-56 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          <button id="add-keyword-btn"
            class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium px-3 py-1.5 rounded-lg">
            Add
          </button>
        </div>
      </div>

      <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
            <tr>
              <th class="text-left px-4 py-2.5 font-medium">Keyword</th>
              <th class="text-left px-4 py-2.5 font-medium">Position</th>
              <th class="text-left px-4 py-2.5 font-medium">Change</th>
              <th class="text-left px-4 py-2.5 font-medium">Last checked</th>
              <th class="px-4 py-2.5"></th>
            </tr>
          </thead>
          <tbody id="keywords-tbody" class="divide-y divide-slate-100"></tbody>
        </table>
        <div id="keywords-empty" class="hidden text-center py-10 text-sm text-slate-400">
          No keywords yet — add your first one above.
        </div>
      </div>

      <!-- Rank history chart -->
      <div id="chart-panel" class="hidden mt-6 bg-white border border-slate-200 rounded-xl p-4">
        <h3 class="text-sm font-medium mb-3">Rank history — <span id="chart-keyword-label"></span></h3>
        <canvas id="rank-chart" height="90"></canvas>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  let session = null;
  let projects = [];
  let activeProjectId = null;
  let chartInstance = null;

  const authCheck = document.getElementById('auth-check');
  const dashboardScreen = document.getElementById('dashboard-screen');

  // ---------- AUTH GUARD ----------
  // This is a protected route. No session → send the user to /auth.
  // Also re-run the guard on any auth state change (e.g. token expiry
  // or the user signing out in another tab).
  sb.auth.onAuthStateChange((_event, sess) => {
    if (!sess) {
      window.location.href = '/auth';
    }
  });

  sb.auth.getSession().then(({ data }) => {
    if (data.session) {
      onAuthed(data.session);
    } else {
      window.location.href = '/auth';
    }
  });

  document.getElementById('signout-btn').onclick = async () => {
    await sb.auth.signOut();
    window.location.href = '/';
  };

  async function onAuthed(sess) {
    session = sess;
    authCheck.classList.add('hidden');
    dashboardScreen.classList.remove('hidden');
    document.getElementById('user-email').textContent = session.user.email;
    await loadProjects();
  }

  // ---------- API HELPER ----------
  async function api(path, options = {}) {
    const res = await fetch(`${API_BASE_URL}${path}`, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session.access_token}`,
        ...(options.headers || {}),
      },
    });
    if (res.status === 204) return null;
    const body = await res.json().catch(() => null);
    if (!res.ok) throw new Error(body?.error || `Request failed (${res.status})`);
    return body;
  }

  // ---------- PROJECTS ----------
  async function loadProjects() {
    projects = await api('/projects/');
    renderProjects();
  }

  function renderProjects() {
    const list = document.getElementById('projects-list');
    list.innerHTML = '';

    projects.forEach((p) => {
      const card = document.createElement('button');
      card.className = `text-left bg-white border rounded-xl p-4 hover:shadow-md transition ${
        p.id === activeProjectId ? 'border-indigo-500 ring-1 ring-indigo-500' : 'border-slate-200'
      }`;
      card.innerHTML = `
        <div class="font-medium text-sm">${escapeHtml(p.domain)}</div>
        <div class="text-xs text-slate-500 mt-1">${p.keyword_count || 0}/20 keywords · ${p.target_country.toUpperCase()}</div>
      `;
      card.onclick = () => selectProject(p.id);
      list.appendChild(card);
    });
  }

  document.getElementById('new-project-btn').onclick = async () => {
    const domain = prompt('Domain to track (e.g. example.com):');
    if (!domain) return;
    const country = prompt('Target country code (e.g. us, uk, de):', 'us') || 'us';
    try {
      await api('/projects/', { method: 'POST', body: JSON.stringify({ domain, target_country: country }) });
      await loadProjects();
    } catch (err) {
      alert(err.message);
    }
  };

  async function selectProject(id) {
    activeProjectId = id;
    renderProjects();
    document.getElementById('project-panel').classList.remove('hidden');
    const project = projects.find((p) => p.id === id);
    document.getElementById('panel-domain').textContent = project.domain;
    await loadKeywords();
  }

  // ---------- KEYWORDS ----------
  async function loadKeywords() {
    const keywords = await api(`/projects/${activeProjectId}/keywords/`);
    renderKeywords(keywords);
  }

  function renderKeywords(keywords) {
    const tbody = document.getElementById('keywords-tbody');
    const empty = document.getElementById('keywords-empty');
    tbody.innerHTML = '';
    document.getElementById('panel-count').textContent = keywords.length;

    if (keywords.length === 0) {
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    keywords.forEach((k) => {
      const tr = document.createElement('tr');
      tr.className = 'hover:bg-slate-50 cursor-pointer';
      tr.onclick = (e) => {
        if (e.target.closest('[data-no-row-click]')) return;
        showChart(k);
      };

      const posBadge = k.current_position
        ? `<span class="inline-flex items-center px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 text-xs font-medium">#${k.current_position}</span>`
        : `<span class="text-xs text-slate-400">—</span>`;

      const change = computeChange(k.current_position, k.previous_position);

      tr.innerHTML = `
        <td class="px-4 py-3 font-medium">${escapeHtml(k.keyword_text)}</td>
        <td class="px-4 py-3">${posBadge}</td>
        <td class="px-4 py-3">${change}</td>
        <td class="px-4 py-3 text-slate-500 text-xs">${k.last_checked_at ? new Date(k.last_checked_at).toLocaleDateString() : 'Pending first check'}</td>
        <td class="px-4 py-3 text-right" data-no-row-click>
          <button class="text-slate-400 hover:text-red-600 text-xs" data-delete-id="${k.id}">Remove</button>
        </td>
      `;
      tr.querySelector('[data-delete-id]').onclick = () => deleteKeyword(k.id);
      tbody.appendChild(tr);
    });
  }

  function computeChange(current, previous) {
    if (!current || !previous) return `<span class="text-xs text-slate-400">—</span>`;
    const diff = previous - current; // positive = moved up (improved)
    if (diff === 0) return `<span class="text-xs text-slate-400">No change</span>`;
    if (diff > 0) return `<span class="text-xs font-medium text-emerald-600">▲ +${diff}</span>`;
    return `<span class="text-xs font-medium text-red-600">▼ ${diff}</span>`;
  }

  document.getElementById('add-keyword-btn').onclick = async () => {
    const input = document.getElementById('new-keyword-input');
    const text = input.value.trim();
    if (!text) return;
    try {
      await api(`/projects/${activeProjectId}/keywords/`, {
        method: 'POST',
        body: JSON.stringify({ keyword_text: text }),
      });
      input.value = '';
      await loadKeywords();
      await loadProjects();
    } catch (err) {
      alert(err.message);
    }
  };

  async function deleteKeyword(id) {
    if (!confirm('Remove this keyword?')) return;
    await api(`/projects/${activeProjectId}/keywords/${id}`, { method: 'DELETE' });
    await loadKeywords();
    await loadProjects();
  }

  // ---------- RANK HISTORY CHART ----------
  async function showChart(keyword) {
    const history = await api(`/projects/${activeProjectId}/keywords/${keyword.id}/history`);
    const panel = document.getElementById('chart-panel');
    panel.classList.remove('hidden');
    document.getElementById('chart-keyword-label').textContent = keyword.keyword_text;

    const labels = history.map((h) => new Date(h.checked_date).toLocaleDateString());
    const data = history.map((h) => h.position || null);

    if (chartInstance) chartInstance.destroy();
    const ctx = document.getElementById('rank-chart').getContext('2d');
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Position',
          data,
          borderColor: '#4f46e5',
          backgroundColor: 'rgba(79,70,229,0.08)',
          tension: 0.3,
          fill: true,
          pointRadius: 3,
        }],
      },
      options: {
        scales: {
          y: { reverse: true, title: { display: true, text: 'Google Position' }, ticks: { stepSize: 5 } },
        },
        plugins: { legend: { display: false } },
      },
    });

    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ---------- UTIL ----------
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
})();
</script>

</body>
</html>
